<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loka Translator - Web UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for terminal */
        #terminal::-webkit-scrollbar {
            width: 8px;
        }
        #terminal::-webkit-scrollbar-track {
            background: #1f2937;
        }
        #terminal::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        #terminal::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s ease-in-out infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold flex items-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                Loka Translator Control Panel
            </h1>
            <span id="app-version" class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full font-mono font-medium tracking-wide"></span>
        </div>
        <div class="space-x-2">
            <button id="btnStart" class="bg-green-500 hover:bg-green-400 text-white px-4 py-2 rounded transition font-medium text-sm">Start Translation</button>
            <button id="btnStop" class="bg-red-500 hover:bg-red-400 text-white px-4 py-2 rounded transition font-medium text-sm hidden">Stop</button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Settings -->
        <div class="w-1/3 bg-white border-r overflow-y-auto p-4 flex flex-col gap-4">
            
            <div class="bg-gray-50 p-3 rounded border">
                <h2 class="font-semibold text-gray-700 mb-2 border-b pb-1">API Settings</h2>
                <div class="space-y-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-500">GEMINI_API_KEY (Primary)</label>
                        <input type="text" id="cfg_geminiApiKey" class="w-full border rounded p-1.5 text-sm" placeholder="AIzaSy...">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">GEMINI_API_KEY_2 (Backup)</label>
                        <input type="text" id="cfg_geminiApiKey2" class="w-full border rounded p-1.5 text-sm" placeholder="Optional backup key">
                    </div>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="block text-xs font-medium text-gray-500">MODEL</label>
                            <input type="text" id="cfg_model" class="w-full border rounded p-1.5 text-sm" placeholder="gemini-2.5-flash">
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs font-medium text-gray-500 mb-1">TRANSLATION DIR</label>
                            <div class="flex items-center gap-2 mt-1">
                                <label class="text-sm flex items-center gap-1 cursor-pointer">
                                    <input type="radio" name="translate_dir" value="PL" checked> EN to PL
                                </label>
                                <label class="text-sm flex items-center gap-1 cursor-pointer">
                                    <input type="radio" name="translate_dir" value="EN"> PL to EN
                                </label>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">MAX_CONCURRENCY</label>
                        <input type="number" id="cfg_maxConcurrency" class="w-full border rounded p-1.5 text-sm" placeholder="1">
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-3 rounded border">
                <h2 class="font-semibold text-gray-700 mb-2 border-b pb-1">Delays (ms)</h2>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-500">SCROLL</label>
                        <input type="number" id="cfg_scrollDelay" class="w-full border rounded p-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">EDITOR_LOAD</label>
                        <input type="number" id="cfg_editorLoadDelay" class="w-full border rounded p-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">BEFORE_SAVE</label>
                        <input type="number" id="cfg_beforeSaveDelay" class="w-full border rounded p-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">ROW_NEXT</label>
                        <input type="number" id="cfg_rowNextDelay" class="w-full border rounded p-1.5 text-sm">
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-3 rounded border">
                <h2 class="font-semibold text-gray-700 mb-2 border-b pb-1">Telegram Notifier</h2>
                <div class="space-y-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-500">TG_BOT_TOKEN</label>
                        <input type="password" id="cfg_tgBotToken" class="w-full border rounded p-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500">CHAT_ID</label>
                        <input type="text" id="cfg_chatId" class="w-full border rounded p-1.5 text-sm">
                    </div>
                </div>
            </div>

        </div>

        <!-- Center Inputs (Projects & Prompt) -->
        <div class="w-1/3 flex flex-col border-r bg-white">
            <div class="flex flex-col p-4 border-b h-1/3 min-h-[150px]">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-semibold text-gray-700">Projects to Translate</h2>
                    <span class="text-xs text-gray-500" id="projects-count">0 projects</span>
                </div>
                <div class="mb-3 flex gap-2 shrink-0">
                    <input type="text" id="new-project-input" class="flex-1 border border-indigo-300 rounded p-1.5 text-sm font-mono focus:ring focus:ring-indigo-200 focus:outline-none placeholder-gray-400" placeholder="Paste URL and press Enter...">
                    <button id="btn-add-project" class="bg-indigo-500 text-white px-3 py-1.5 rounded text-sm hover:bg-indigo-400 font-medium transition shrink-0">Add</button>
                </div>
                <div id="projects-container" class="flex-1 overflow-y-auto space-y-2 pr-2">
                    <!-- Dynamic inputs will be inserted here -->
                </div>
            </div>
            <div class="flex-1 flex flex-col p-4">
                <h2 class="font-semibold text-gray-700 mb-2">Gemini Prompt</h2>
                <textarea id="prompt" class="w-full flex-1 border rounded p-2 text-sm font-mono resize-none focus:ring focus:ring-indigo-200 focus:outline-none"></textarea>
            </div>
        </div>

        <!-- Right Terminal -->
        <div class="w-1/3 bg-gray-900 text-green-400 font-mono text-xs flex flex-col relative shrink-0">
            <div class="bg-gray-800 text-gray-300 px-3 py-1 text-xs border-b border-gray-700 flex justify-between items-center">
                <span>System Logs</span>
                <button id="btnClearLogs" class="hover:text-white transition">Clear</button>
            </div>
            <div id="terminal" class="flex-1 overflow-y-auto p-3 whitespace-pre-wrap break-words"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        Notification
    </div>

    <script>
        const DOM = {
            cfgInputs: document.querySelectorAll('input[id^="cfg_"]'),
            projectsContainer: document.getElementById('projects-container'),
            projectsCount: document.getElementById('projects-count'),
            prompt: document.getElementById('prompt'),
            btnStart: document.getElementById('btnStart'),
            btnStop: document.getElementById('btnStop'),
            terminal: document.getElementById('terminal'),
            btnClearLogs: document.getElementById('btnClearLogs'),
            toast: document.getElementById('toast'),
            translateToRadios: document.querySelectorAll('input[name="translate_dir"]'),
            appVersion: document.getElementById('app-version'),
            newProjectInput: document.getElementById('new-project-input'),
            btnAddProject: document.getElementById('btn-add-project')
        };

        let isRunning = false;

        function createProjectInput(value = "") {
            const wrap = document.createElement('div');
            wrap.className = "flex gap-2 items-center shrink-0";

            const input = document.createElement('input');
            input.type = "text";
            input.className = "flex-1 border rounded p-1.5 text-sm font-mono focus:ring focus:ring-indigo-200 focus:outline-none project-url";
            input.value = value;

            const btnRemove = document.createElement('button');
            btnRemove.innerHTML = "&times;";
            btnRemove.className = "text-gray-400 hover:text-red-500 font-bold px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded";
            btnRemove.onclick = () => {
                wrap.remove();
                updateProjectsCount();
                autoSave();
            };

            input.addEventListener('input', () => {
                if (input.value.trim() === "") {
                    wrap.remove();
                }
                updateProjectsCount();
                autoSave();
            });

            wrap.appendChild(input);
            wrap.appendChild(btnRemove);
            return wrap;
        }

        function handleAddProject(val) {
            const urls = val.split('\n').map(l => l.trim()).filter(l => l !== "" && !l.startsWith("#"));
            // Reverse so they are prepended in the original top-to-bottom order
            urls.reverse().forEach(url => {
                DOM.projectsContainer.prepend(createProjectInput(url));
            });
            updateProjectsCount();
            autoSave();
        }

        DOM.newProjectInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleAddProject(DOM.newProjectInput.value);
                DOM.newProjectInput.value = '';
            }
        });

        DOM.newProjectInput.addEventListener('paste', (e) => {
            const pasteData = (e.clipboardData || window.clipboardData).getData('text');
            if (pasteData.includes('\n')) {
                e.preventDefault();
                handleAddProject(pasteData);
                DOM.newProjectInput.value = '';
            }
        });

        DOM.btnAddProject.addEventListener('click', () => {
            handleAddProject(DOM.newProjectInput.value);
            DOM.newProjectInput.value = '';
            DOM.newProjectInput.focus();
        });

        function getProjectList() {
            const inputs = Array.from(DOM.projectsContainer.querySelectorAll('.project-url'));
            return inputs.map(i => i.value.trim()).filter(v => v !== "");
        }

        function updateProjectsCount() {
            const count = getProjectList().length;
            DOM.projectsCount.textContent = `${count} project${count !== 1 ? 's' : ''}`;
        }

        function renderProjects(projectsString) {
            DOM.projectsContainer.innerHTML = '';
            const urls = projectsString.split('\n').map(l => l.trim()).filter(l => l !== "" && !l.startsWith("#"));
            urls.forEach(url => {
                DOM.projectsContainer.appendChild(createProjectInput(url));
            });
            updateProjectsCount();
        }

        function showToast(msg, isError = false) {
            DOM.toast.textContent = msg;
            DOM.toast.className = `fixed bottom-4 right-4 px-4 py-2 rounded shadow-lg transition-opacity duration-300 z-50 text-white ${isError ? 'bg-red-600' : 'bg-green-600'}`;
            DOM.toast.style.opacity = '1';
            setTimeout(() => { DOM.toast.style.opacity = '0'; }, 3000);
        }

        function appendLog(text) {
            const span = document.createElement('span');
            
            // Basic colorization based on content
            if(text.includes('❌') || text.includes('error') || text.includes('WARN')) {
                span.className = 'text-red-400';
            } else if (text.includes('✅') || text.includes('🚀')) {
                span.className = 'text-green-300';
            } else if (text.includes('⚠️')) {
                span.className = 'text-yellow-400';
            } else if (text.includes('ℹ️') || text.includes('info')) {
                span.className = 'text-blue-300';
            }

            span.textContent = text + (text.endsWith('\n') ? '' : '\n');
            DOM.terminal.appendChild(span);
            DOM.terminal.scrollTop = DOM.terminal.scrollHeight;
        }

        async function loadData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                
                if(data.config) {
                    DOM.cfgInputs.forEach(input => {
                        const key = input.id.replace('cfg_', '');
                        if(data.config[key] !== undefined) {
                            input.value = data.config[key];
                        }
                    });

                    if(data.config.translateTo) {
                        DOM.translateToRadios.forEach(r => {
                            r.checked = (r.value === data.config.translateTo);
                        });
                        window.currentLang = data.config.translateTo;
                    }
                    
                    window.currentPrompts = data.config.prompts || {};
                    DOM.prompt.value = window.currentPrompts[data.config.translateTo] || '';
                    
                    renderProjects((data.config.projects || []).join('\n'));
                }
                
                if(data.version) {
                    DOM.appVersion.textContent = `v${data.version}`;
                }
                
                updateUIState(data.isRunning);
                
                appendLog("✅ Configuration loaded.");
            } catch(e) {
                showToast("Failed to load data", true);
                appendLog("❌ Failed to load configuration: " + e);
            }
        }

        let saveTimeout;
        function autoSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveData(true);
            }, 800);
        }

        async function saveData(silent = false) {
            const config = {};
            DOM.cfgInputs.forEach(input => {
                const key = input.id.replace('cfg_', '');
                if (input.type === 'number') {
                    config[key] = parseInt(input.value, 10) || 0;
                } else {
                    config[key] = input.value;
                }
            });

            DOM.translateToRadios.forEach(r => {
                if(r.checked) config.translateTo = r.value;
            });

            config.projects = getProjectList();
            config.prompts = window.currentPrompts || {};
            config.prompts[config.translateTo] = DOM.prompt.value;

            const payload = { config };

            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    if (!silent) showToast("Configuration saved!");
                } else {
                    throw new Error(await res.text());
                }
            } catch(e) {
                if (!silent) showToast("Save failed", true);
                appendLog("❌ Save error: " + e);
                throw e; // rethrow for start to catch
            }
        }

        async function startTask() {
            try {
                await saveData(false); // Always save explicitly before starting
                
                DOM.btnStart.disabled = true;
                DOM.btnStart.innerHTML = '<span class="spinner"></span> Starting...';

                const res = await fetch('/api/start', { method: 'POST' });
                if(res.ok) {
                    updateUIState(true);
                    showToast("Translation started!");
                } else {
                    const errText = await res.text();
                    showToast("Error starting", true);
                    appendLog("❌ Start error: " + errText);
                    updateUIState(false);
                }
            } catch(e) {
                updateUIState(false);
            }
        }

        async function stopTask() {
            try {
                const res = await fetch('/api/stop', { method: 'POST' });
                if(res.ok) {
                    showToast("Stop signal sent");
                    appendLog("🛑 Sending stop signal...");
                }
            } catch(e) {
                showToast("Error stopping", true);
            }
        }

        function updateUIState(running) {
            isRunning = running;
            if(running) {
                DOM.btnStart.classList.add('hidden');
                DOM.btnStop.classList.remove('hidden');
            } else {
                DOM.btnStart.classList.remove('hidden');
                DOM.btnStart.disabled = false;
                DOM.btnStart.innerHTML = 'Start Translation';
                DOM.btnStop.classList.add('hidden');
            }
        }

        // SSE For Logs
        function connectLogs() {
            const evtSource = new EventSource('/api/logs');
            evtSource.onmessage = function(event) {
                // Check for special control messages from server
                if (event.data === "___PROCESS_STARTED___") {
                    updateUIState(true);
                } else if (event.data === "___PROCESS_STOPPED___") {
                    updateUIState(false);
                } else {
                    appendLog(event.data);
                }
            };
            evtSource.onerror = function(err) {
                // Connection lost or server restarting
                console.log("SSE error", err);
            };
        }

        async function fetchPromptForLang(lang) {
            if (window.currentPrompts && window.currentPrompts[lang]) {
                DOM.prompt.value = window.currentPrompts[lang];
                return;
            }
            try {
                const res = await fetch(`/api/prompt?lang=${lang}`);
                const promptText = await res.text();
                if (window.currentPrompts) window.currentPrompts[lang] = promptText;
                DOM.prompt.value = promptText;
            } catch(e) {
                console.error("Failed to fetch prompt", e);
                showToast("Failed to fetch prompt", true);
            }
        }
function handleLangChange() {
    let lang = 'PL';
    let oldLang = window.currentLang;
    DOM.translateToRadios.forEach(r => { if(r.checked) lang = r.value; });

    if (oldLang && window.currentPrompts) {
        window.currentPrompts[oldLang] = DOM.prompt.value;
    }
    window.currentLang = lang;
    fetchPromptForLang(lang);
    autoSave();
}

        // Event Listeners
        DOM.cfgInputs.forEach(input => input.addEventListener('input', autoSave));
        DOM.prompt.addEventListener('input', autoSave);
        DOM.btnStart.addEventListener('click', startTask);
        DOM.btnStop.addEventListener('click', stopTask);
        DOM.translateToRadios.forEach(r => r.addEventListener('change', handleLangChange));
        DOM.btnClearLogs.addEventListener('click', () => { DOM.terminal.innerHTML = ''; });

        // Init
        loadData();
        connectLogs();

    </script>
</body>
</html>
