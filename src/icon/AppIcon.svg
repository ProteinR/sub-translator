<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FD08F"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA4D"/>
      <stop offset="1" stop-color="#F08A1C"/>
    </linearGradient>
    <g id="bill">
      <rect x="-150" y="-78" width="300" height="156" rx="18" fill="#BFE8C4" stroke="#1F6F43" stroke-width="10"/>
      <rect x="-124" y="-54" width="248" height="108" rx="10" fill="none" stroke="#2F855A" stroke-width="6"/>
      <circle r="40" fill="#E8F7EA" stroke="#2F855A" stroke-width="6"/>
      <text y="22" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="64" fill="#1F6F43">$</text>
    </g>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <!-- купюры за котом -->
    <use href="#bill" transform="translate(300 330) rotate(-24)"/>
    <use href="#bill" transform="translate(730 320) rotate(20)"/>
    <use href="#bill" transform="translate(250 800) rotate(14)"/>
    <use href="#bill" transform="translate(790 790) rotate(-16)"/>
    <use href="#bill" transform="translate(512 880) rotate(4)"/>

    <!-- кот -->
    <g transform="translate(512 560)">
      <path d="M-230 -60 L-200 -300 L-60 -190 Z" fill="url(#fur)" stroke="#9A4A0B" stroke-width="12" stroke-linejoin="round"/>
      <path d="M230 -60 L200 -300 L60 -190 Z" fill="url(#fur)" stroke="#9A4A0B" stroke-width="12" stroke-linejoin="round"/>
      <path d="M-196 -120 L-182 -248 L-100 -180 Z" fill="#F9A8B8"/>
      <path d="M196 -120 L182 -248 L100 -180 Z" fill="#F9A8B8"/>
      <ellipse rx="262" ry="220" fill="url(#fur)" stroke="#9A4A0B" stroke-width="12"/>
      <path d="M-40 -205 Q-34 -160 -46 -120 M0 -215 Q6 -165 0 -122 M40 -205 Q46 -160 34 -120" stroke="#C9650F" stroke-width="18" stroke-linecap="round" fill="none"/>
      <path d="M-262 10 Q-210 0 -180 20 M262 10 Q210 0 180 20" stroke="#C9650F" stroke-width="16" stroke-linecap="round" fill="none"/>
      <ellipse cy="70" rx="120" ry="88" fill="#FFF1DC"/>
      <!-- очки-купюры -->
      <g>
        <rect x="-190" y="-70" width="160" height="96" rx="34" fill="#1F2937"/>
        <rect x="30" y="-70" width="160" height="96" rx="34" fill="#1F2937"/>
        <path d="M-30 -36 Q0 -54 30 -36" stroke="#1F2937" stroke-width="16" fill="none"/>
        <text x="-110" y="-2" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="72" fill="#4ADE80">$</text>
        <text x="110" y="-2" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="72" fill="#4ADE80">$</text>
        <path d="M-170 -54 L-140 -54" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
        <path d="M50 -54 L80 -54" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="10" stroke-linecap="round"/>
      </g>
      <path d="M-26 46 L26 46 L0 76 Z" fill="#EC6A8F" stroke="#9A4A0B" stroke-width="6" stroke-linejoin="round"/>
      <path d="M0 76 Q-10 110 -50 104 M0 76 Q10 110 50 104" stroke="#7C3A0B" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M-120 64 L-300 40 M-120 90 L-300 100 M120 64 L300 40 M120 90 L300 100" stroke="#FFF7EA" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- купюра в лапах -->
    <use href="#bill" transform="translate(512 780) scale(.9)"/>
    <ellipse cx="380" cy="770" rx="62" ry="46" fill="url(#fur)" stroke="#9A4A0B" stroke-width="10"/>
    <ellipse cx="644" cy="770" rx="62" ry="46" fill="url(#fur)" stroke="#9A4A0B" stroke-width="10"/>

    <!-- пузырь перевода -->
    <g transform="translate(748 236) scale(.86)">
      <path d="M-104 -70 H104 Q134 -70 134 -40 V30 Q134 60 104 60 H-20 L-64 100 L-58 60 H-104 Q-134 60 -134 30 V-40 Q-134 -70 -104 -70 Z" fill="#FFFFFF" stroke="#065F46" stroke-width="10"/>
      <text x="0" y="22" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-weight="800" font-size="78" fill="#065F46">A→Я</text>
    </g>
